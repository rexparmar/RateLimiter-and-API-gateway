spring.application.name=sentinel-gateway
server.port=8080

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=hello-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://127.0.0.1:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/hello
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[0].filters[0]=DemoRateLimit
